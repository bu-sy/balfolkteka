  - artist: Androneda
    track_name: Oscar - Live
    links:
    - portal: Spotify
      link: https://open.spotify.com/track/2R1pWZQQvzwMZfcV2YnrAp
    - portal: YouTube
      link: https://www.youtube.com/watch?v=kOT3x6tVzC4
    lyrics: |
      Het was heel lang geleden, je woonde nog bij ons.
      Ik kon toen niet begrijpen dat je vertrekken moest.
      Ik wist wel dat je zachte vacht en dat je zwarte haar
      Niet voor iedereen in huis het meest gezonde was.

      Toen kwam de dag waar niemand van hen mij van had verteld.
      Ze hebben me in plaats daarvan iets op de mouw gespeld.
      "Hij is nu lekker buiten spelen maak je maar niet druk."
      Maar ik had overal gezocht en jij kwam niet terug.

      Ik bleef maar vragen waar je was, want ik liet het niet los.
      Totdat mijn zusje het niet langer voor zich houden kon.
      Ze was veel jonger maar ze had als enige het lef
      te zeggen waar het dier was waar ik steeds nog om geef.

      Ze lieten me maar zoeken, ze lieten jou gewoon
      weggaan zonder afscheid, man, hoe konden ze dat doen?

      De tranen stroomden uiteraard en hielden niet meer op
      Vol onmacht keek ze toe: het was een trauma in de dop.
      Ze deed alleen maar voor haar kind het beste dat ze kon
      maar had daarna echt geen idee hoe ze het vertellen moest.

      Je kind gaat boven ieder dier, dat snap ik ook wel, heus.
      Maar toch denk ik nog altijd: was er echt geen andere keuze?
      Een ander huis, een opvang, of iets wat zich daar voor leent?
      Want ook al was je oud en ziek, dit heb je niet vierdiend.

      Ze lieten me maar zoeken, ze lieten jou gewoon
      weggaan zonder afscheid, man, hoe konden ze dat doen?

      Ze lieten me maar zoeken, ze zeiden me geen word;
      ze durfden niets te zeggen want ze hebben je vermoord!
